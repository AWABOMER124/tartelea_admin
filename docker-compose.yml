services:
  tartelea-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: tartelea-admin
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_ALLOWED_HOSTS=${ADMIN_ALLOWED_HOSTS}

